<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>右键菜单管理器</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><path d="M4 14l2.4-8A2 2 0 0 1 8.3 4.6h7.4A2 2 0 0 1 17.6 6L20 14"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 17h.01M11 17h.01"/></symbol>
    <symbol id="i-windows" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-filetype" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5M21 3l-6.5 18-4-7.5L3 9.5z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="12" r="2"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.5L4 8"/><path d="M4 4v4h4M4 13a8 8 0 0 0 14.3 4.5L20 16"/><path d="M20 20v-4h-4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v5M12 17.5h.01"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg><use href="#i-menu"/></svg></span>
      <span class="brand-name">右键菜单管理器</span>
    </div>
    <nav class="nav" id="nav" aria-label="场景">
      <div class="nav-indicator" id="navIndicator"></div>
    </nav>
    <div class="sidebar-foot">
      <button class="nav-item" id="btnSettings" type="button"><svg><use href="#i-settings"/></svg><span>设置</span></button>
      <div class="env" id="envBadge"></div>
    </div>
  </aside>

  <main class="main">
    <div class="banner" id="banner" hidden></div>

    <section class="view" id="viewList">
      <header class="head">
        <div class="head-text">
          <h1 id="sceneTitle"></h1>
          <p id="sceneDesc"></p>
        </div>
        <button class="icon-btn" id="btnRefresh" type="button" title="重新扫描（F5）" aria-label="重新扫描"><svg><use href="#i-refresh"/></svg></button>
      </header>

      <div class="toolbar">
        <label class="search">
          <svg><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="搜索名称、软件或路径" autocomplete="off" spellcheck="false">
        </label>
        <div class="seg" id="filterSeg" role="tablist" aria-label="状态筛选">
          <button type="button" data-filter="all" class="on">全部</button>
          <button type="button" data-filter="enabled">已启用</button>
          <button type="button" data-filter="disabled">已禁用</button>
        </div>
        <label class="check-pill" title="显示 Windows 自带的菜单项（默认锁定）">
          <input type="checkbox" id="showSystem"><span>显示系统项</span>
        </label>
      </div>

      <form class="ext-form" id="extForm" hidden>
        <input id="extInput" type="text" placeholder="输入扩展名，例如 .jpg" autocomplete="off" spellcheck="false" maxlength="32">
        <button class="btn primary" type="submit">扫描</button>
        <span class="ext-hint" id="extHint">会查看这个扩展名、它关联的程序类型，以及同类文件的公共菜单。</span>
      </form>

      <div class="list-head" id="listHead">
        <label class="cbx" title="全选当前列表（Ctrl+A）"><input type="checkbox" id="selectAll"><span></span></label>
        <span class="list-count" id="listCount"></span>
      </div>
      <div class="list" id="list" tabindex="-1"></div>
    </section>

    <section class="view" id="viewHistory" hidden>
      <header class="head">
        <div class="head-text">
          <h1>历史与回滚</h1>
          <p>每次应用改动都会先备份，并在这里留下记录。可以撤销整批，也可以只撤销其中一项。</p>
        </div>
        <button class="btn" id="btnOpenHistoryDir" type="button"><svg><use href="#i-open"/></svg>打开备份目录</button>
      </header>
      <div class="history" id="history"></div>
    </section>

    <div class="actionbar" id="actionbar" aria-live="polite">
      <div class="ab-group" id="abSelection">
        <span class="ab-text"><b id="selCount">0</b> 项已选</span>
        <button class="btn sm" type="button" data-bulk="Disable">禁用</button>
        <button class="btn sm" type="button" data-bulk="Enable">启用</button>
        <button class="btn sm danger-ghost" type="button" data-bulk="Delete">删除</button>
        <button class="btn sm ghost" type="button" id="btnClearSel">取消选择</button>
      </div>
      <div class="ab-spacer"></div>
      <div class="ab-group" id="abPending">
        <span class="ab-text"><b id="pendCount">0</b> 项更改待应用</span>
        <button class="btn sm ghost" type="button" id="btnDiscard">放弃</button>
        <button class="btn sm primary" type="button" id="btnApply">应用更改</button>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
